apiVersion: apps/v1
kind: Deployment
metadata:
  name: decase-ai
  namespace: sk-team-08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decase-ai
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/health"
        update: 1095f8b825fe1e415b531016c46cb630
      labels:
        app: decase-ai
    spec:
      # 🔑 Spring Boot와 동일한 PVC 공유를 위한 초기화
      initContainers:
        - name: init-shared-storage
          image: busybox:1.35
          command:
            - /bin/sh
            - -c
            - |
              echo "Initializing shared storage directories..."
              mkdir -p /app/storage/uploads
              mkdir -p /app/storage/srs
              mkdir -p /app/storage/asis
              mkdir -p /app/storage/mockups
              chmod -R 777 /app/storage
              ls -la /app/storage
              echo "Shared storage initialization complete"
          volumeMounts:
            - name: shared-storage-volume
              mountPath: /app/storage

      containers:
        - name: decase-ai
          image: amdp-registry.skala-ai.com/skala25a/sk-team-08-decase-ai:1.0.0-46-515fa3084893
          imagePullPolicy: Always

          # 🔑 Spring Boot와 같은 PVC, 같은 경로에 마운트
          volumeMounts:
            - name: shared-storage-volume
              mountPath: /app/storage  # Spring Boot와 동일

          env:
            - name: LOGGING_LEVEL
              value: DEBUG
            - name: USER_NAME
              value: sk-team-08
            - name: NAMESPACE
              value: sk-team-08
            
            # DB 설정
            - name: MARIA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: MARIA_PASSWORD
            - name: MARIA_USER
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: MARIA_USER
            - name: MARIA_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: MARIA_HOST
            - name: MARIA_PORT
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: MARIA_PORT
            - name: MARIA_NAME
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: MARIA_NAME
            
            # API Key 설정
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: ANTHROPIC_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: GOOGLE_API_KEY
            
            # 🔑 Spring Boot와 호환되는 경로 설정
            - name: FILE_STORAGE_PATH_UPLOADS
              value: "/app/storage/uploads"    # Spring Boot: /app/storage/uploads
            - name: FILE_STORAGE_PATH_SRS
              value: "/app/storage/srs"        # Spring Boot: /app/storage (신규)
            - name: FILE_STORAGE_PATH_ASIS
              value: "/app/storage/asis"       # Spring Boot: /app/storage/asis
            - name: FILE_STORAGE_PATH_MOCKUP
              value: "/app/storage/mockups"    # Spring Boot: /app/storage/mockups

      # 🔑 Spring Boot와 같은 PVC 사용
      volumes:
        - name: shared-storage-volume
          persistentVolumeClaim:
            claimName: decase-efs-sc-pvc  # Spring Boot와 동일한 PVC
